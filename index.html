<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Для тебя ❤️</title>
    <!-- Подключаем красивые шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff4d6d;
            --primary-dark: #c9184a;
            --text-main: #590d22;
            --text-muted: #800f2f;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #ffe5ec;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Анимированный абстрактный фон (размытые сферы) */
        .bg-shapes {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.7;
            animation: float 10s infinite ease-in-out alternate;
        }

        .shape.one {
            width: 300px; height: 300px;
            background: #ffb3c1;
            top: -50px; left: -100px;
            animation-delay: 0s;
        }

        .shape.two {
            width: 400px; height: 400px;
            background: #ffc2d1;
            bottom: -100px; right: -150px;
            animation-delay: -3s;
        }

        .shape.three {
            width: 250px; height: 250px;
            background: #ffccd5;
            top: 40%; left: 50%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -50px) scale(1.1); }
        }

        /* Анимированные сердечки на фоне */
        .hearts-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Чтобы не перекрывали клики */
            z-index: 2;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            bottom: -10vh;
            color: rgba(255, 77, 109, 0.6);
            font-size: 24px;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.5); opacity: 0; }
        }

        /* Основной контейнер с эффектом стекла */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(89, 13, 34, 0.08), 
                        inset 0 0 0 1px rgba(255,255,255,0.5);
            z-index: 10;
            position: relative;
            text-align: center;
        }

        /* Шаги */
        .step-container {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .step-container.active {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        /* Типографика */
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 600;
            line-height: 1.2;
            color: var(--primary-dark);
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-weight: 600;
        }

        .icon-lock {
            font-size: 2.5rem;
            margin-bottom: 15px;
            animation: pulse-soft 2s infinite;
        }

        /* Элементы управления (Шаг 1) */
        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 1.3rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            border: 2px solid rgba(255, 77, 109, 0.3);
            border-radius: 16px;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            color: var(--primary-dark);
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
            letter-spacing: 3px;
        }

        input[type="text"]::placeholder {
            color: #ffb3c1;
            letter-spacing: 1px;
            font-weight: 400;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.2);
        }

        button.main-btn {
            margin-top: 25px;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #ff4d6d 0%, #c9184a 100%);
            border: none;
            border-radius: 25px;
            box-shadow: 0 8px 20px rgba(201, 24, 74, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button.main-btn:active {
            transform: translateY(2px) scale(0.97);
            box-shadow: 0 4px 10px rgba(201, 24, 74, 0.2);
        }

        /* Ошибка валидации */
        p.error-text {
            color: #d00000;
            font-size: 0.9rem;
            margin-top: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            border-left: 3px solid #d00000;
            min-height: 40px;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            font-weight: 600;
            line-height: 1.4;
        }

        p.error-text.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
            border-color: #d00000 !important;
            color: #d00000 !important;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Шаг 2: Кнопки */
        .buttons-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff4d6d 0%, #c9184a 100%);
            z-index: 2;
            padding: 16px 40px;
            border-radius: 30px;
            border: none;
            color: white;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 8px 25px rgba(201, 24, 74, 0.4);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: pulse-heart 2s infinite;
        }

        @keyframes pulse-heart {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 77, 109, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0); }
        }

        .btn-no {
            background: #fff;
            color: var(--text-muted);
            border: 2px solid #ffb3c1;
            padding: 14px 35px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.1rem;
            position: relative;
            z-index: 50;
            transition: left 0.35s cubic-bezier(0.25, 1, 0.5, 1), top 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Шаг 3: GIF */
        .gif-container img {
            max-width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(89, 13, 34, 0.15);
            border: 4px solid #fff;
        }

        /* Шаг 4: Финал */
        .dress-code-badge {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px 25px;
            border-radius: 20px;
            font-size: 1rem;
            color: var(--primary-dark);
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(255, 179, 193, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .heart-icon {
            color: #ff4d6d;
            font-size: 1.2rem;
            animation: pulse-soft 1.5s infinite;
        }

        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
    </style>
</head>
<body>

    <!-- Фоновые анимации -->
    <div class="bg-shapes">
        <div class="shape one"></div>
        <div class="shape two"></div>
        <div class="shape three"></div>
    </div>

    <!-- Контейнер для всплывающих сердечек -->
    <div id="hearts-bg" class="hearts-bg"></div>

    <!-- Основная карточка (Стекло) -->
    <div class="glass-card">
        
        <!-- Шаг 1: Авторизация -->
        <div id="step1" class="step-container active">
            <div class="icon-lock">🔐</div>
            <h1>Секретный доступ</h1>
            <p class="subtitle">Введи свою дату рождения</p>
            
            <div class="input-group">
                <input type="text" id="dateInput" inputmode="numeric" placeholder="ДД.ММ.ГГГГ" maxlength="10" autocomplete="off">
                <p id="errorMessage" class="error-text">Доступ запрещен.<br>Похоже, это свидание только для одной особенной красотки 😉</p>
                <button class="main-btn" onclick="checkDate()">Продолжить</button>
            </div>
        </div>

        <!-- Шаг 2: Главный вопрос -->
        <div id="step2" class="step-container">
            <h1>Готова пойти со мной на свидание?</h1>
            <p class="subtitle">Выбор за тобой (или нет)</p>
            <div class="buttons-wrapper" id="buttonsWrapper">
                <button id="btnYes" class="btn-yes" onclick="goToStep(3)">Да!</button>
                <button id="btnNo" class="btn-no">Нет</button>
            </div>
        </div>

        <!-- Шаг 3: Экран с GIF -->
        <div id="step3" class="step-container">
            <div class="gif-container">
                <img src="hhgf.gif" alt="Cute GIF" onerror="this.onerror=null; this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIHZpZXdCb3g9IjAgMCAyMDAgMjAwIj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgZmlsbD0iI2ZmYjNjMSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LXNpemU9IjE0IiBmaWxsPSIjNTkwZDIyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjNlbSI+R0lGIG5vdCBmb3VuZDwvdGV4dD48L3N2Zz4=';">
            </div>
        </div>

        <!-- Шаг 4: Финальный экран -->
        <div id="step4" class="step-container">
            <h1>Ксюша, приеду за тобой через 30 минут.</h1>
            <h1 style="color: #ff4d6d;">До встречи <span class="heart-icon">❤️</span></h1>
            
            <div class="dress-code-badge">
                <span>👗</span> Дресс-код: удобная одежда и обувь
            </div>
        </div>

    </div>

    <script>
        // Функция переключения шагов
        function goToStep(stepNumber) {
            const currentStep = document.querySelector('.step-container.active');
            
            // Плавное затухание
            if (currentStep) {
                currentStep.style.opacity = '0';
                currentStep.style.transform = 'translateY(-15px)';
                
                setTimeout(() => {
                    currentStep.classList.remove('active');
                    currentStep.style = ''; // Сброс инлайн-стилей
                    
                    const nextStep = document.getElementById(`step${stepNumber}`);
                    if (nextStep) {
                        nextStep.classList.add('active');
                    }

                    // ВАЖНО: Прячем кнопку "Нет", если мы перешли на шаг 3 или дальше
                    if (stepNumber >= 3) {
                        const btnNo = document.getElementById('btnNo');
                        if (btnNo) {
                            btnNo.style.display = 'none';
                        }
                    }

                    // Переход от GIF к финалу
                    if (stepNumber === 3) {
                        setTimeout(() => {
                            goToStep(4);
                        }, 3000);
                    }
                }, 500); // Ожидание окончания CSS-анимации
            }
        }

        // Автоматическое форматирование ввода
        const dateInput = document.getElementById('dateInput');
        dateInput.addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, ''); 
            
            if (value.length > 8) value = value.substring(0, 8);
            
            let formattedValue = '';
            if (value.length > 0) formattedValue += value.substring(0, 2);
            if (value.length >= 3) formattedValue += '.' + value.substring(2, 4);
            if (value.length >= 5) formattedValue += '.' + value.substring(4, 8);
            
            e.target.value = formattedValue;
            
            document.getElementById('errorMessage').classList.remove('visible');
            dateInput.classList.remove('shake');
        });

        // Шаг 1: Валидация
        function checkDate() {
            const errorMessage = document.getElementById('errorMessage');
            const targetDate = "01.10.2005";
            
            if (dateInput.value === targetDate) {
                errorMessage.classList.remove('visible');
                dateInput.classList.remove('shake');
                goToStep(2);
            } else {
                errorMessage.classList.add('visible');
                dateInput.classList.remove('shake');
                void dateInput.offsetWidth; 
                dateInput.classList.add('shake');
                
                // Вибрация телефона, если поддерживается
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
            }
        }

        // Шаг 2: Убегающая кнопка "Нет"
        const btnNo = document.getElementById('btnNo');
        const btnYes = document.getElementById('btnYes');
        let yesScale = 1; 
        let isAbsolute = false; 
        let lastMove = 0; // Защита от двойных срабатываний на телефонах

        function moveNoButton(e) {
            if(e) e.preventDefault(); 
            
            const now = Date.now();
            if (now - lastMove < 50) return; // Игнорируем слишком частые вызовы
            lastMove = now;

            // Переводим кнопку в fixed и ВЫНОСИМ из карточки
            if (!isAbsolute) {
                document.body.appendChild(btnNo); // Переносим в корень body
                btnNo.style.position = 'fixed';
                isAbsolute = true;
            }

            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const btnWidth = btnNo.offsetWidth;
            const btnHeight = btnNo.offsetHeight;

            // Зона безопасности
            const safePadding = 20;

            const randomX = Math.max(safePadding, Math.floor(Math.random() * (viewportWidth - btnWidth - safePadding)));
            const randomY = Math.max(safePadding, Math.floor(Math.random() * (viewportHeight - btnHeight - safePadding)));

            btnNo.style.left = `${randomX}px`;
            btnNo.style.top = `${randomY}px`;

            // Увеличиваем кнопку "Да"
            yesScale += 0.2;
            btnYes.style.transform = `scale(${yesScale})`;
            
            // Отключаем пульсацию, если кнопка "Да" стала большой
            if(yesScale > 1.2) {
                btnYes.style.animation = 'none';
            }
        }

        btnNo.addEventListener('touchstart', moveNoButton, { passive: false });
        btnNo.addEventListener('mouseenter', moveNoButton);

        // Генерация падающих сердечек на фоне
        function createHearts() {
            const container = document.getElementById('hearts-bg');
            const heartIcons = ['❤️', '💖', '💕', '🌸', '✨'];
            
            for(let i=0; i<30; i++) {
                let heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerHTML = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                
                // Случайные координаты и параметры анимации
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                heart.style.animationDuration = (Math.random() * 15 + 10) + 's';
                heart.style.animationDelay = (Math.random() * 10) + 's';
                heart.style.opacity = (Math.random() * 0.5 + 0.3);
                
                container.appendChild(heart);
            }
        }
        
        // Запускаем сердечки
        createHearts();
    </script>
</body>
</html>
